<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Familiemøte — Referater</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Warm Scandinavian palette — cozy home-meeting feel */
      --primary:      #2D4A3E;   /* deep forest green */
      --primary-2:    #1F362C;
      --primary-bg:   #E5ECE6;
      --accent:       #B85C38;   /* warm terracotta */
      --accent-2:     #9A4A2B;
      --accent-bg:    #F4E4DA;

      --bg:           #F4EEE2;   /* warm parchment */
      --bg-2:         #ECE4D2;
      --card:         #FFFCF5;   /* warm white */
      --card-2:       #FAF3E4;
      --text:         #1F1A14;   /* warm near-black */
      --muted:        #74695C;   /* warm grey */
      --soft:         #A89B89;
      --border:       #E5DCC9;
      --border-2:     #D9CFB9;

      --success:      #4F7A4F;
      --success-bg:   #DDE9D7;
      --danger:       #B0463A;
      --danger-bg:    #F3DAD3;
      --blue-bg:      #DDE6E4;
      --grey-bg:      #ECE5D5;

      --r:            14px;
      --rs:           10px;
      --rxs:          6px;
      --shadow-sm:    0 1px 2px rgba(63, 49, 28, .06), 0 1px 1px rgba(63, 49, 28, .04);
      --shadow:       0 4px 14px rgba(63, 49, 28, .08), 0 2px 4px rgba(63, 49, 28, .04);
      --shadow-lg:    0 18px 40px rgba(45, 74, 62, .18), 0 6px 14px rgba(45, 74, 62, .08);

      --font-sans:    'DM Sans', system-ui, -apple-system, sans-serif;
      --font-serif:   'Instrument Serif', 'Iowan Old Style', Georgia, serif;
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      font-size: 16px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-image:
        radial-gradient(at 8% 0%, rgba(184, 92, 56, .08) 0, transparent 45%),
        radial-gradient(at 92% 100%, rgba(45, 74, 62, .10) 0, transparent 50%);
      background-attachment: fixed;
    }
    h1, h2, h3 { font-family: var(--font-serif); font-weight: 400; letter-spacing: -.005em; line-height: 1.1; }

    .screen { display: none; }
    .screen.active { display: block; }
    #login-screen {
      display: none; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh;
      padding: 1.25rem; position: relative; overflow: hidden;
      background: radial-gradient(at 20% 20%, #3A5C4E 0%, #2D4A3E 45%, #1F362C 100%);
    }
    #login-screen::before {
      content: ''; position: absolute; inset: -20%;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(184, 92, 56, .35) 0, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(244, 228, 218, .15) 0, transparent 40%);
      pointer-events: none;
    }
    #login-screen::after {
      content: ''; position: absolute; inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      pointer-events: none;
    }
    #login-screen.active { display: flex; }

    #loading-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(244, 238, 226, .75);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      z-index: 900; align-items: center; justify-content: center;
    }
    #loading-overlay.on { display: flex; }
    .spinner {
      width: 36px; height: 36px; border: 2.5px solid var(--border-2);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast {
      position: fixed; bottom: 5.5rem; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--card);
      padding: .75rem 1.25rem;
      border-radius: 999px; font-size: .875rem; font-weight: 500;
      opacity: 0; transition: all .3s cubic-bezier(.16,1,.3,1); pointer-events: none;
      white-space: nowrap; z-index: 950;
      box-shadow: 0 12px 32px rgba(31, 26, 20, .25), 0 0 0 1px rgba(255,255,255,.05) inset;
      letter-spacing: -.005em;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok  { background: var(--primary); color: #fff; }
    #toast.err { background: var(--accent); color: #fff; }

    .login-card {
      background: var(--card); border-radius: 22px;
      padding: 2.75rem 2rem 2.25rem;
      width: 100%; max-width: 380px;
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.04);
      text-align: center; position: relative; z-index: 2;
      border: 1px solid rgba(255,255,255,.5);
    }
    .login-logo {
      width: 64px; height: 64px; margin: 0 auto .9rem;
      border-radius: 18px;
      background: linear-gradient(160deg, var(--primary) 0%, var(--primary-2) 100%);
      color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 8px 24px rgba(45, 74, 62, .35), inset 0 1px 0 rgba(255,255,255,.15);
    }
    .login-title {
      font-family: var(--font-serif); font-weight: 400;
      font-size: 2.2rem; line-height: 1; margin-bottom: .25rem;
      letter-spacing: -.015em;
    }
    .login-sub {
      color: var(--muted); font-size: .875rem; margin-bottom: 2rem;
      letter-spacing: .01em;
    }
    .login-err   { color: var(--danger); font-size: .8rem; margin-top: .4rem; display: none; text-align: left; }
    .login-err.on { display: block; }

    .app-header {
      background: rgba(255, 252, 245, .82);
      backdrop-filter: saturate(140%) blur(14px);
      -webkit-backdrop-filter: saturate(140%) blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.25rem; display: flex; align-items: center; height: 64px;
      position: sticky; top: 0; z-index: 100;
    }
    .hdr-title {
      flex: 1; font-family: var(--font-serif); font-weight: 400;
      font-size: 1.45rem; color: var(--text);
      letter-spacing: -.01em;
      display: flex; align-items: center; gap: .55rem;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hdr-actions { display: flex; gap: .25rem; align-items: center; }

    .main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 6rem; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
      padding: .7rem 1.25rem; border-radius: 999px; font-size: .9rem;
      font-weight: 500; cursor: pointer; border: 1px solid transparent;
      transition: transform .15s, background .15s, border-color .15s, box-shadow .2s;
      white-space: nowrap; font-family: inherit; letter-spacing: -.005em;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn-primary {
      background: var(--primary); color: #fff;
      box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 4px 12px rgba(45, 74, 62, .22);
    }
    .btn-primary:hover { background: var(--primary-2); transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 8px 20px rgba(45, 74, 62, .28); }
    .btn-sec   { background: var(--card); color: var(--text); border-color: var(--border-2); }
    .btn-sec:hover { background: var(--card-2); border-color: var(--soft); }
    .btn-ghost { background: transparent; color: var(--muted); padding: .5rem .8rem; }
    .btn-ghost:hover { background: var(--card-2); color: var(--text); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { padding: .45rem .85rem; font-size: .8rem; }
    .btn-lg { padding: .95rem 1.5rem; font-size: 1rem; width: 100%; font-weight: 600; }
    .btn-icon { padding: 0; width: 40px; height: 40px; border-radius: 50%; }
    .btn-icon.btn-ghost:hover { background: var(--card-2); }

    .fg { margin-bottom: 1.25rem; }
    label {
      display: block; font-size: .72rem; font-weight: 600;
      margin-bottom: .45rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em;
    }
    input[type=text], input[type=date], input[type=password], textarea, select {
      width: 100%; padding: .75rem 1rem; border: 1px solid var(--border-2);
      border-radius: var(--rs); font-size: .95rem; font-family: inherit;
      color: var(--text); background: var(--card);
      transition: border-color .15s, box-shadow .15s, background .15s;
      outline: none; letter-spacing: -.005em;
    }
    input::placeholder, textarea::placeholder { color: var(--soft); }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 74, 62, .12);
      background: var(--card);
    }
    select {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5L6 6.5L11 1.5' stroke='%2374695C' stroke-width='1.5' stroke-linecap='round' fill='none'/></svg>");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      padding-right: 2.25rem;
    }
    textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .cb-group { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .3rem; }
    .cb-chip {
      display: flex; align-items: center; gap: .4rem; background: var(--card);
      border: 1px solid var(--border-2); border-radius: 999px; padding: .45rem .85rem;
      cursor: pointer; transition: all .15s; user-select: none; font-size: .875rem;
      color: var(--muted); font-weight: 500;
      -webkit-tap-highlight-color: transparent;
    }
    .cb-chip input { display: none; }
    .cb-chip::before {
      content: ''; width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid var(--border-2); background: var(--card);
      transition: all .15s; flex-shrink: 0;
    }
    .cb-chip.checked {
      background: var(--primary); border-color: var(--primary);
      color: #fff; font-weight: 500;
      box-shadow: 0 2px 8px rgba(45, 74, 62, .2);
    }
    .cb-chip.checked::before {
      background: #fff;
      border-color: #fff;
      box-shadow: inset 0 0 0 3.5px var(--primary);
    }
    .cb-section-label {
      font-size: .68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .1em; color: var(--soft); margin: .6rem 0 .35rem;
    }

    .ag-form-item {
      background: var(--card); border-radius: var(--rs); border: 1px solid var(--border);
      margin-bottom: .5rem; overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .ag-form-item.dragging {
      opacity: .5;
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(45, 74, 62, .18);
    }
    .ag-form-item.drag-over-top    { box-shadow: inset 0 3px 0 var(--accent); }
    .ag-form-item.drag-over-bottom { box-shadow: inset 0 -3px 0 var(--accent); }
    .ag-form-row {
      display: flex; align-items: center; gap: .5rem; padding: .65rem .75rem;
    }
    .ag-drag {
      cursor: grab; user-select: none; font-size: 1rem;
      color: var(--soft); padding: .25rem .35rem; border-radius: 6px;
      flex-shrink: 0; line-height: 1;
    }
    .ag-drag:hover { background: var(--card-2); color: var(--muted); }
    .ag-form-num {
      background: var(--bg-2); color: var(--primary);
      width: 24px; height: 24px;
      border-radius: 50%; font-size: .75rem; font-weight: 600;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      font-family: var(--font-serif); font-weight: 400; font-style: italic;
      font-size: .9rem;
    }
    .ag-form-row input {
      flex: 1; border: 1px solid transparent; background: transparent; padding: .4rem .55rem;
      font-size: .95rem; outline: none; min-width: 0;
      border-radius: 6px; transition: background .15s, border-color .15s;
    }
    .ag-form-row input:focus { background: var(--bg); border-color: var(--border); }
    .ag-notes-toggle {
      background: none; border: none; cursor: pointer; font-size: .78rem;
      color: var(--soft); padding: .35rem .55rem; transition: color .15s, background .15s;
      border-radius: 6px; flex-shrink: 0; font-family: inherit;
    }
    .ag-notes-toggle:hover { color: var(--primary); background: var(--card-2); }
    .ag-notes-area { padding: 0 .75rem .75rem; display: none; }
    .ag-notes-area.open { display: block; }
    .ag-notes-area textarea {
      font-size: .875rem; min-height: 64px; background: var(--bg);
      border-color: var(--border);
    }

    .rm-btn {
      background: transparent; color: var(--soft); border: none;
      border-radius: 50%; width: 28px; height: 28px; font-size: 1.25rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s; line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }
    .rm-btn:hover { background: var(--danger-bg); color: var(--danger); }
    .add-btn {
      background: var(--card); border: 1px dashed var(--border-2); border-radius: var(--rs);
      color: var(--muted); padding: .65rem 1rem; font-size: .875rem; cursor: pointer;
      width: 100%; transition: all .15s; font-family: inherit; margin-top: .35rem;
      font-weight: 500; letter-spacing: -.005em;
    }
    .add-btn:hover {
      border-color: var(--primary); border-style: solid;
      color: var(--primary); background: var(--card-2);
    }

    .task-form-item {
      background: var(--card); border-radius: var(--rs); border: 1px solid var(--border);
      padding: .75rem; margin-bottom: .5rem;
    }
    .task-form-row1 { display: flex; align-items: center; gap: .4rem; margin-bottom: .4rem; }
    .task-form-row1 select { flex: 0 0 110px; }
    .task-form-row1 input[type=text] { flex: 1; }
    .task-form-row1 input[type=date] { flex: 0 0 130px; }
    .task-form-row2 { display: flex; align-items: center; gap: .4rem; }
    .task-form-row2 select { flex: 0 0 140px; }
    .task-form-row2 input { flex: 1; font-size: .825rem; }

    .pg-hdr { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.75rem; gap: 1rem; }
    .pg-hdr h2 { font-size: 2.25rem; line-height: 1; }
    .pg-hdr .count-pill {
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); font-size: .78rem; font-weight: 500;
      padding: .35rem .75rem; border-radius: 999px; flex-shrink: 0;
      letter-spacing: -.005em;
    }

    .r-card {
      background: var(--card); border-radius: var(--r); padding: 1.25rem 1.4rem;
      margin-bottom: .65rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
      cursor: pointer; transition: transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s, border-color .2s;
      position: relative; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .r-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--primary); opacity: 0; transition: opacity .2s;
    }
    .r-card:hover { box-shadow: var(--shadow); border-color: var(--border-2); transform: translateY(-2px); }
    .r-card:hover::before { opacity: 1; }
    .r-card:active { transform: translateY(0); }
    .r-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .9rem; }
    .r-card-title {
      font-family: var(--font-serif); font-weight: 400; font-size: 1.4rem;
      margin-bottom: .35rem; letter-spacing: -.01em; line-height: 1.15;
    }
    .r-card-meta  {
      font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap;
      gap: .25rem .9rem; align-items: center;
    }
    .r-card-meta span { display: inline-flex; align-items: center; gap: .3rem; }
    .date-badge {
      background: var(--bg-2); color: var(--primary); font-size: .72rem;
      font-weight: 600; padding: .35rem .7rem; border-radius: 999px;
      white-space: nowrap; flex-shrink: 0; letter-spacing: .01em;
      border: 1px solid var(--border);
    }
    .empty {
      text-align: center; padding: 4rem 1.5rem; color: var(--muted);
      background: var(--card); border-radius: var(--r);
      border: 1px dashed var(--border-2);
    }
    .empty .icon { font-size: 2.5rem; margin-bottom: 1rem; opacity: .6; }
    .empty h3 { font-size: 1.4rem; margin-bottom: .35rem; color: var(--text); }
    .empty p { font-size: .9rem; }

    .fab {
      position: fixed; bottom: 1.5rem; right: 1.5rem; width: 58px; height: 58px;
      border-radius: 50%; color: #fff; border: none;
      font-size: 1.5rem; cursor: pointer;
      background: linear-gradient(155deg, var(--accent) 0%, var(--accent-2) 100%);
      box-shadow: 0 10px 24px rgba(184, 92, 56, .45), inset 0 1px 0 rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
      transition: transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s; z-index: 50;
      -webkit-tap-highlight-color: transparent;
      font-weight: 300;
    }
    .fab:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 14px 32px rgba(184, 92, 56, .55), inset 0 1px 0 rgba(255,255,255,.2); }
    .fab:active { transform: scale(.96); }

    .det-head {
      background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
      border-radius: var(--r); padding: 1.75rem 1.5rem;
      border: 1px solid var(--border); margin-bottom: 1.25rem;
      position: relative; overflow: hidden;
    }
    .det-head::before {
      content: ''; position: absolute; top: 0; right: 0; width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(184, 92, 56, .1) 0%, transparent 70%);
      pointer-events: none;
    }
    .det-konu {
      font-family: var(--font-serif); font-weight: 400;
      font-size: 2rem; line-height: 1.05; margin-bottom: .5rem;
      letter-spacing: -.015em; position: relative;
    }
    .det-meta  { font-size: .875rem; color: var(--muted); position: relative; letter-spacing: -.005em; }
    .det-meta strong { color: var(--text); font-weight: 600; }

    .det-sec { margin-bottom: 1.5rem; }
    .det-sec-title {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted); margin-bottom: .75rem;
      font-weight: 600;
      display: flex; align-items: center; gap: .5rem;
    }
    .det-sec-title::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chip  {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border-2);
      border-radius: 999px; padding: .35rem .8rem; font-size: .825rem; font-weight: 500;
      letter-spacing: -.005em;
    }

    .acc-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--rs); margin-bottom: .45rem; overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .acc-item.open { border-color: var(--border-2); box-shadow: var(--shadow-sm); }
    .acc-trigger {
      display: flex; align-items: center; gap: .85rem; padding: .9rem 1.1rem;
      cursor: pointer; user-select: none; transition: background .15s; width: 100%;
      background: none; border: none; font-family: inherit; font-size: .95rem;
      text-align: left; color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .acc-trigger:hover { background: var(--card-2); }
    .acc-num {
      background: var(--bg-2); color: var(--primary);
      width: 28px; height: 28px;
      border-radius: 50%; font-size: 1rem; font-weight: 400;
      font-family: var(--font-serif); font-style: italic;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .acc-item.open .acc-num { background: var(--primary); color: var(--card); }
    .acc-label { flex: 1; font-weight: 500; letter-spacing: -.005em; }
    .acc-arrow {
      font-size: .7rem; color: var(--soft); transition: transform .2s cubic-bezier(.16,1,.3,1);
      flex-shrink: 0;
    }
    .acc-item.open .acc-arrow { transform: rotate(90deg); color: var(--primary); }
    .acc-body {
      display: none; padding: 1rem 1.1rem 1.1rem;
      border-top: 1px solid var(--border); background: var(--card-2);
    }
    .acc-item.open .acc-body { display: block; }
    .acc-body p { font-size: .9rem; line-height: 1.65; white-space: pre-wrap; color: var(--text); }
    .acc-no-notes { font-size: .85rem; color: var(--soft); font-style: italic; font-family: var(--font-serif); font-size: 1rem; }

    .status-badge {
      display: inline-flex; align-items: center; gap: .35rem; border-radius: 999px;
      padding: .25rem .65rem; font-size: .72rem; font-weight: 600; white-space: nowrap;
      letter-spacing: .005em;
    }
    .status-ikke_startet { background: var(--grey-bg); color: var(--muted); }
    .status-pagaar       { background: var(--blue-bg); color: var(--primary); }
    .status-fullfort     { background: var(--success-bg); color: var(--success); }
    .status-avbrutt      { background: var(--danger-bg); color: var(--danger); }

    .task-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--rs); padding: .9rem 1rem; margin-bottom: .5rem;
      transition: border-color .15s, box-shadow .15s;
    }
    .task-card:hover { border-color: var(--border-2); box-shadow: var(--shadow-sm); }
    .task-card.avbrutt .task-name { text-decoration: line-through; opacity: .55; }
    .task-card.fullfort { background: linear-gradient(0deg, var(--success-bg) 0%, var(--card) 100%); border-color: rgba(79, 122, 79, .25); }
    .task-card-row1 { display: flex; align-items: flex-start; gap: .65rem; margin-bottom: .5rem; }
    .task-who  {
      background: var(--accent); color: #fff;
      border-radius: 999px; padding: .2rem .65rem; font-size: .75rem;
      font-weight: 600; white-space: nowrap; flex-shrink: 0;
      letter-spacing: -.005em;
      box-shadow: 0 1px 2px rgba(184, 92, 56, .25);
    }
    .task-name { flex: 1; font-size: .95rem; font-weight: 500; line-height: 1.4; letter-spacing: -.005em; }
    .task-card-row2 { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; }
    .task-due  {
      font-size: .78rem; color: var(--muted);
      display: inline-flex; align-items: center; gap: .25rem;
    }
    .task-notes-text {
      font-size: .85rem; color: var(--muted); margin-top: .55rem;
      padding: .55rem .75rem; background: var(--bg);
      border-left: 2px solid var(--border-2); border-radius: 4px;
      font-family: var(--font-serif); font-style: italic; font-size: 1rem; line-height: 1.4;
    }

    .task-edit-box {
      margin-top: .75rem;
      padding-top: .75rem;
      border-top: 1px dashed var(--border-2);
    }
    .task-edit-row {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
    }
    .task-edit-row select {
      flex: 1 1 180px;
      max-width: 220px;
    }

    .next-banner {
      background: linear-gradient(135deg, var(--accent-bg) 0%, var(--card-2) 100%);
      border: 1px solid rgba(184, 92, 56, .2);
      border-radius: var(--r); padding: 1rem 1.25rem; display: flex;
      align-items: center; gap: .9rem; font-weight: 500; margin-bottom: 1.25rem;
    }
    .next-banner .ni {
      font-size: 1.6rem; width: 44px; height: 44px;
      background: var(--accent); color: #fff;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 0 4px 12px rgba(184, 92, 56, .3);
    }
    .next-banner > div:last-child { line-height: 1.3; }
    .next-banner .next-label {
      font-size: .68rem; text-transform: uppercase; letter-spacing: .12em;
      color: var(--accent-2); margin-bottom: .15rem; font-weight: 600;
    }
    .next-banner .next-date {
      font-family: var(--font-serif); font-weight: 400;
      font-size: 1.2rem; line-height: 1.1; color: var(--text);
      letter-spacing: -.005em;
    }

    .comments-wrap { padding-top: 1.75rem; margin-top: 1.5rem; border-top: 1px solid var(--border); }
    .comments-wrap h2 { font-size: 1.6rem; margin-bottom: 1rem; }
    .com-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: .9rem 1.1rem; margin-bottom: .5rem;
    }
    .com-top { display: flex; align-items: center; gap: .5rem; margin-bottom: .4rem; }
    .com-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 600;
      font-family: var(--font-serif); font-style: italic;
    }
    .com-author { font-weight: 600; font-size: .9rem; letter-spacing: -.005em; }
    .com-date { font-size: .75rem; color: var(--soft); margin-left: auto; }
    .com-text { font-size: .925rem; line-height: 1.55; color: var(--text); white-space: pre-wrap; }
    .com-form {
      background: var(--card); border-radius: var(--r); padding: 1.1rem;
      border: 1px solid var(--border); margin-top: 1rem;
    }
    .com-form label { font-size: .68rem; }
    .com-row { display: flex; gap: .6rem; margin-top: .5rem; }
    .com-row select { flex: 0 0 140px; }
    .com-row textarea { flex: 1; min-height: 60px; }

    @media (max-width: 640px) {
      .grid2 { grid-template-columns: 1fr; gap: .85rem; }
      .main  { padding: 1.25rem 1rem 6rem; }
      .pg-hdr h2 { font-size: 1.85rem; }
      .hdr-title { font-size: 1.2rem; }
      .app-header { padding: 0 .9rem; height: 60px; }
      .fab {
        bottom: 1.1rem; right: 1.1rem; width: 56px; height: 56px;
        bottom: max(1.1rem, env(safe-area-inset-bottom, 0));
      }
      #toast { white-space: normal; max-width: calc(100vw - 2rem); text-align: center; bottom: 6rem; }
      .btn:not(.btn-icon):not(.btn-sm) { min-height: 46px; }
      .acc-trigger { min-height: 52px; padding: 1rem; }
      .cb-chip { padding: .55rem .95rem; font-size: .9rem; }
      .rm-btn { width: 34px; height: 34px; font-size: 1.35rem; }
      .add-btn { padding: .75rem 1rem; font-size: .9rem; }
      .r-card { padding: 1.1rem 1.15rem; }
      .r-card-title { font-size: 1.2rem; }
      .det-head { padding: 1.4rem 1.2rem; }
      .det-konu { font-size: 1.55rem; }
      .login-card { padding: 2.25rem 1.5rem 2rem; }
      .login-title { font-size: 1.85rem; }
      input[type=text], input[type=date], input[type=password], textarea, select {
        font-size: 16px; /* prevent iOS zoom */
      }
      .login-card .btn-lg { font-size: 1rem; }

      .task-form-row1 { flex-wrap: wrap; }
      .task-form-row1 select { flex: 1 1 auto; min-width: 0; }
      .task-form-row1 input[type=text] { flex: 1 1 100%; order: 3; }
      .task-form-row1 input[type=date] { flex: 1 1 100%; order: 4; }
      .task-form-row1 .rm-btn { order: 2; flex-shrink: 0; }

      .task-form-row2 { flex-direction: column; gap: .4rem; }
      .task-form-row2 select { flex: none; width: 100%; }
      .task-form-row2 input  { flex: none; }

      .com-row { flex-direction: column; }
      .com-row select { flex: none; }
      .ag-notes-area textarea { min-height: 64px; }
      .task-card-row1 { gap: .5rem; }
      .task-card-row2 { flex-wrap: wrap; gap: .4rem; }

      .task-edit-row {
        flex-direction: column;
        align-items: stretch;
      }
      .task-edit-row select {
        max-width: none;
      }
    }

    /* Small phones */
    @media (max-width: 380px) {
      .pg-hdr h2 { font-size: 1.65rem; }
      .r-card-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div></div>
<div id="toast"></div>

<div id="login-screen" class="screen">
  <div class="login-card">
    <div class="login-logo">🏠</div>
    <h1 class="login-title">Familiemøte</h1>
    <p class="login-sub">Referater & Beslutninger</p>
    <div class="fg">
      <input type="password" id="pwd-input" placeholder="Familiepassord" autocomplete="current-password" />
      <div class="login-err" id="pwd-err">Feil passord, prøv igjen.</div>
    </div>
    <button class="btn btn-primary btn-lg" onclick="doLogin()">Logg inn</button>
  </div>
</div>

<div id="app-screen" class="screen">

  <header class="app-header">
    <button class="btn btn-ghost btn-icon" id="back-btn" onclick="goBack()" style="display:none">←</button>
    <div class="hdr-title" id="hdr-title">🏠 Familiemøte</div>
    <div class="hdr-actions">
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logg ut</button>
    </div>
  </header>

  <div class="main">

    <div id="view-list">
      <div class="pg-hdr">
        <h2>Referater</h2>
        <span id="r-count" class="count-pill"></span>
      </div>
      <div id="r-list">
        <div class="empty"><div class="spinner" style="margin:0 auto"></div></div>
      </div>
    </div>

    <div id="view-new" style="display:none">
      <h2 style="margin-bottom:1.25rem">Nytt referat</h2>

      <div class="grid2">
        <div class="fg">
          <label>Tittel</label>
          <input type="text" id="f-konu" placeholder="Uke 14" />
        </div>
        <div class="fg">
          <label>Dato</label>
          <input type="date" id="f-tarih" />
        </div>
      </div>

      <div class="grid2">
        <div class="fg">
          <label>Opprettet av</label>
          <select id="f-olusturan"></select>
        </div>
      </div>

      <div class="fg">
        <label>Deltakere</label>
        <div class="cb-section-label">Fast</div>
        <div class="cb-group" id="f-std-deltakere"></div>
        <div class="cb-section-label" style="margin-top:.5rem">Ekstra</div>
        <div class="cb-group" id="f-ext-deltakere"></div>
      </div>

      <div class="fg">
        <label>Dagsorden</label>
        <div id="f-gundem-list"></div>
        <button class="add-btn" onclick="addGundem()">+ Legg til dagsordenspunkt</button>
      </div>

      <div class="fg">
        <label>Oppgavefordeling</label>
        <div id="f-gorev-list"></div>
        <button class="add-btn" onclick="addGorev()">+ Legg til oppgave</button>
      </div>

      <div class="fg">
        <label>Neste møte</label>
        <input type="date" id="f-sonraki" />
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.5rem">
        <button class="btn btn-primary" style="flex:1;min-width:160px" onclick="saveReferat()">💾 Lagre referat</button>
        <button class="btn btn-sec" style="min-width:90px" onclick="showList()">Avbryt</button>
      </div>
    </div>

    <div id="view-detail" style="display:none">
      <div id="detail-content"></div>
    </div>

  </div>

  <button class="fab" id="fab" onclick="showNew()">＋</button>

</div>

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBp6DbrNAXRUy8XMno6gIDpcMRwmZi4WdM",
  authDomain:        "husmote.firebaseapp.com",
  projectId:         "husmote",
  storageBucket:     "husmote.firebasestorage.app",
  messagingSenderId: "900959582920",
  appId:             "1:900959582920:web:716ee9c4cb4fca520203fd"
};

const PASSORD = "flekken";

const STD_DELTAKERE = ["Fikret", "Lise", "Elif"];
const EXT_DELTAKERE = ["Pernille", "Çağatay"];

const STANDARD_DAGSORDEN = [
  "Godkjenning av forrige referat",
  "Avtaler for kommende uke",
  "Andre beskjeder",
  "Felles aktivitet",
  "Innkjøp",
  "Eventuelt"
];

const STATUSER = {
  ikke_startet: { label: "Ikke startet", cls: "status-ikke_startet", ikon: "⬜" },
  pagaar:       { label: "Pågår",        cls: "status-pagaar",       ikon: "🔄" },
  fullfort:     { label: "Fullført",     cls: "status-fullfort",     ikon: "✅" },
  avbrutt:      { label: "Avbrutt",      cls: "status-avbrutt",      ikon: "❌" }
};

function getISOWeek(dateStr) {
  const d = new Date((dateStr || today()) + 'T12:00:00');
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7);
}

function today() { return new Date().toISOString().split('T')[0]; }

function doLogin() {
  const v = document.getElementById('pwd-input').value;
  const err = document.getElementById('pwd-err');
  if (v === PASSORD) {
    sessionStorage.setItem('auth', '1');
    err.classList.remove('on');
    showApp();
  } else {
    err.classList.add('on');
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}
document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogout() {
  sessionStorage.removeItem('auth');
  showScreen('login-screen');
  document.getElementById('pwd-input').value = '';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

let viewStack = ['list'];
let currentReferat = null;

function showApp() {
  showScreen('app-screen');
  showList();
  loadReferatlar();
}

function showList() {
  hide(['view-new','view-detail']);
  show('view-list');
  show('fab');
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('hdr-title').textContent = '🏠 Familiemøte';
  viewStack = ['list'];
}

function showNew() {
  hide(['view-list','view-detail']);
  show('view-new');
  hide('fab');
  document.getElementById('back-btn').style.display = 'flex';
  document.getElementById('hdr-title').textContent = 'Nytt referat';
  viewStack.push('new');
  initNewForm();
}

function showDetailView(id) {
  hide(['view-list','view-new']);
  show('view-detail');
  hide('fab');
  document.getElementById('back-btn').style.display = 'flex';
  viewStack.push('detail:' + id);
  loadDetail(id);
}

function goBack() {
  viewStack.pop();
  const last = viewStack[viewStack.length - 1];
  if (!last || last === 'list') showList();
  else if (last.startsWith('detail:')) showDetailView(last.split(':')[1]);
  else showList();
}

function hide(ids) {
  (Array.isArray(ids) ? ids : [ids]).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
}
function show(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = '';
}

const IS_CONFIGURED = FIREBASE_CONFIG.apiKey !== "DIN_API_NØKKEL";
let db = null;
if (IS_CONFIGURED) {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
}

let allData = [];

function loadReferatlar() {
  if (!IS_CONFIGURED) {
    toast('Firebase ikke konfigurert', 'err');
    return;
  }
  loading(true);
  db.collection('referatlar').orderBy('tarih', 'desc').onSnapshot(snap => {
    allData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderList();
    loading(false);
  }, err => {
    toast('Feil ved lasting', 'err');
    loading(false);
  });
}

function renderList() {
  const el = document.getElementById('r-list');
  document.getElementById('r-count').textContent = allData.length + ' referater';

  if (!allData.length) {
    el.innerHTML = `<div class="empty"><div class="icon">📋</div><h3>Ingen referater ennå</h3><p>Trykk + for å opprette det første referatet.</p></div>`;
    return;
  }

  el.innerHTML = allData.map(r => `
    <div class="r-card" onclick="showDetailView('${r.id}')">
      <div class="r-card-top">
        <div>
          <div class="r-card-title">${esc(r.konu || '—')}</div>
          <div class="r-card-meta">
            <span>👤 ${esc(r.olusturan || '')}</span>
            ${r.katilimcilar?.length ? `<span>👥 ${r.katilimcilar.length} deltakere</span>` : ''}
            ${r.gundem?.length ? `<span>📌 ${r.gundem.length} saker</span>` : ''}
            ${r.yorumlar?.length ? `<span>💬 ${r.yorumlar.length}</span>` : ''}
          </div>
        </div>
        <div class="date-badge">${fmtDate(r.tarih)}</div>
      </div>
    </div>
  `).join('');
}

function initNewForm() {
  const dateStr = today();
  document.getElementById('f-tarih').value = dateStr;
  document.getElementById('f-konu').value  = 'Uke ' + getISOWeek(dateStr);
  document.getElementById('f-sonraki').value = '';

  const datInput = document.getElementById('f-tarih');
  datInput.onchange = function() {
    const kEl = document.getElementById('f-konu');
    if (!kEl.dataset.edited) kEl.value = 'Uke ' + getISOWeek(this.value);
  };

  const konuEl = document.getElementById('f-konu');
  konuEl.dataset.edited = '';
  konuEl.oninput = function() { this.dataset.edited = '1'; };

  const sel = document.getElementById('f-olusturan');
  const alle = [...STD_DELTAKERE, ...EXT_DELTAKERE];
  sel.innerHTML = alle.map(m => `<option value="${m}">${m}</option>`).join('');

  const stdEl = document.getElementById('f-std-deltakere');
  stdEl.innerHTML = STD_DELTAKERE.map(m => `
    <label class="cb-chip checked">
      <input type="checkbox" value="${m}" checked>${m}
    </label>`).join('');

  const extEl = document.getElementById('f-ext-deltakere');
  extEl.innerHTML = EXT_DELTAKERE.map(m => `
    <label class="cb-chip">
      <input type="checkbox" value="${m}">${m}
    </label>`).join('');

  [...stdEl.querySelectorAll('.cb-chip'), ...extEl.querySelectorAll('.cb-chip')].forEach(chip => {
    chip.querySelector('input').addEventListener('change', function() {
      chip.classList.toggle('checked', this.checked);
    });
  });

  const list = document.getElementById('f-gundem-list');
  list.innerHTML = '';
  _gundemCounter = 0;
  STANDARD_DAGSORDEN.forEach(tekst => addGundem(tekst));

  document.getElementById('f-gorev-list').innerHTML = '';
}

let _gundemCounter = 0;
let draggedGundemEl = null;

function addGundem(tekst = '') {
  _gundemCounter++;
  const id = 'ag-' + _gundemCounter;
  const list = document.getElementById('f-gundem-list');
  const num = list.children.length + 1;

  const div = document.createElement('div');
  div.className = 'ag-form-item';
  div.dataset.id = id;
  div.draggable = true;

  div.innerHTML = `
    <div class="ag-form-row">
      <span class="ag-drag" title="Dra for å flytte">⋮⋮</span>
      <span class="ag-form-num">${num}</span>
      <input type="text" placeholder="Dagsordenspunkt..." value="${escAttr(tekst)}" />
      <button type="button" class="ag-notes-toggle" onclick="toggleAgNotes('${id}')" title="Legg til notater">📝 Notater</button>
      <button type="button" class="rm-btn" onclick="removeGundem(this)" title="Fjern">×</button>
    </div>
    <div class="ag-notes-area" id="notes-${id}">
      <textarea placeholder="Notater og beslutninger for dette punktet..."></textarea>
    </div>`;

  attachDragEvents(div);
  list.appendChild(div);
  renumberGundem();
}

function attachDragEvents(el) {
  el.addEventListener('dragstart', () => {
    draggedGundemEl = el;
    el.classList.add('dragging');
  });

  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    document.querySelectorAll('.ag-form-item').forEach(item => {
      item.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    draggedGundemEl = null;
    renumberGundem();
  });

  el.addEventListener('dragover', e => {
    e.preventDefault();
    if (!draggedGundemEl || draggedGundemEl === el) return;

    const rect = el.getBoundingClientRect();
    const offset = e.clientY - rect.top;
    const isTop = offset < rect.height / 2;

    el.classList.remove('drag-over-top', 'drag-over-bottom');
    el.classList.add(isTop ? 'drag-over-top' : 'drag-over-bottom');
  });

  el.addEventListener('dragleave', () => {
    el.classList.remove('drag-over-top', 'drag-over-bottom');
  });

  el.addEventListener('drop', e => {
    e.preventDefault();
    if (!draggedGundemEl || draggedGundemEl === el) return;

    const rect = el.getBoundingClientRect();
    const offset = e.clientY - rect.top;
    const isTop = offset < rect.height / 2;

    el.classList.remove('drag-over-top', 'drag-over-bottom');

    if (isTop) {
      el.parentNode.insertBefore(draggedGundemEl, el);
    } else {
      el.parentNode.insertBefore(draggedGundemEl, el.nextSibling);
    }

    renumberGundem();
  });
}

function toggleAgNotes(id) {
  const area = document.getElementById('notes-' + id);
  area.classList.toggle('open');
  if (area.classList.contains('open')) area.querySelector('textarea').focus();
}

function removeGundem(btn) {
  btn.closest('.ag-form-item').remove();
  renumberGundem();
}

function renumberGundem() {
  document.querySelectorAll('#f-gundem-list .ag-form-item').forEach((el, i) => {
    const num = el.querySelector('.ag-form-num');
    if (num) num.textContent = i + 1;
  });
}

function addGorev() {
  const list = document.getElementById('f-gorev-list');
  const div = document.createElement('div');
  div.className = 'task-form-item';
  const alle = [...STD_DELTAKERE, ...EXT_DELTAKERE];

  div.innerHTML = `
    <div class="task-form-row1">
      <select>${alle.map(m => `<option value="${m}">${m}</option>`).join('')}</select>
      <input type="text" placeholder="Oppgavebeskrivelse...">
      <input type="date">
      <button type="button" class="rm-btn" onclick="this.closest('.task-form-item').remove()">×</button>
    </div>
    <div class="task-form-row2">
      <select>
        <option value="ikke_startet">⬜ Ikke startet</option>
        <option value="pagaar">🔄 Pågår</option>
        <option value="fullfort">✅ Fullført</option>
        <option value="avbrutt">❌ Avbrutt</option>
      </select>
      <input type="text" placeholder="Notater til oppgaven (valgfritt)...">
    </div>`;

  list.appendChild(div);
  div.querySelector('input[type=text]').focus();
}

async function saveReferat() {
  if (!IS_CONFIGURED) return;

  const konu = document.getElementById('f-konu').value.trim();
  if (!konu) {
    document.getElementById('f-konu').focus();
    return;
  }

  const katilimcilar = [...document.querySelectorAll('#f-std-deltakere input:checked, #f-ext-deltakere input:checked')]
    .map(c => c.value);

  const gundem = [...document.querySelectorAll('#f-gundem-list .ag-form-item')].map(el => ({
    tekst: el.querySelector('input[type=text]').value.trim(),
    notater: el.querySelector('textarea').value.trim()
  })).filter(g => g.tekst);

  const gorevler = [...document.querySelectorAll('#f-gorev-list .task-form-item')].map(el => {
    const inputs = el.querySelectorAll('input, select');
    return {
      kisi:      inputs[0].value,
      gorev:     inputs[1].value.trim(),
      son_tarih: inputs[2].value,
      status:    inputs[3].value,
      notater:   inputs[4].value.trim()
    };
  }).filter(g => g.gorev);

  const data = {
    konu,
    tarih:            document.getElementById('f-tarih').value,
    olusturan:        document.getElementById('f-olusturan').value,
    katilimcilar,
    gundem,
    gorevler,
    sonraki_toplanti: document.getElementById('f-sonraki').value,
    olusturma_tarihi: firebase.firestore.FieldValue.serverTimestamp(),
    yorumlar: []
  };

  loading(true);
  try {
    await db.collection('referatlar').add(data);
    toast('✓ Referat lagret!', 'ok');
    showList();
  } catch(e) {
    toast('Feil: ' + e.message, 'err');
  } finally {
    loading(false);
  }
}

async function loadDetail(id) {
  loading(true);
  try {
    const doc = await db.collection('referatlar').doc(id).get();
    if (!doc.exists) {
      showList();
      return;
    }
    currentReferat = { id: doc.id, ...doc.data() };
    renderDetail(currentReferat);
    document.getElementById('hdr-title').textContent = currentReferat.konu || 'Referat';
  } catch(e) {
    toast('Feil ved lasting', 'err');
    showList();
  } finally {
    loading(false);
  }
}

function renderDetail(r) {
  const el = document.getElementById('detail-content');

  let h = `
    <div class="det-head">
      <div class="det-konu">${esc(r.konu || '—')}</div>
      <div class="det-meta">
        ${fmtDate(r.tarih)}
        ${r.olusturan ? ` · Opprettet av <strong>${esc(r.olusturan)}</strong>` : ''}
      </div>
    </div>`;

  if (r.katilimcilar?.length) {
    h += `<div class="det-sec">
      <div class="det-sec-title">👥 Deltakere</div>
      <div class="chips">${r.katilimcilar.map(a => `<span class="chip">${esc(a)}</span>`).join('')}</div>
    </div>`;
  }

  const gundem = r.gundem || [];
  const kararlarFallback = r.kararlar || '';

  if (gundem.length) {
    h += `<div class="det-sec"><div class="det-sec-title">📌 Dagsorden</div>`;
    gundem.forEach((item, i) => {
      const tekst = typeof item === 'string' ? item : (item.tekst || '');
      const notater = typeof item === 'string' ? '' : (item.notater || '');
      const notes = notater || (i === gundem.length - 1 ? kararlarFallback : '');

      h += `
        <div class="acc-item" id="acc-${r.id}-${i}">
          <button class="acc-trigger" onclick="toggleAcc('${r.id}',${i})">
            <span class="acc-num">${i + 1}</span>
            <span class="acc-label">${esc(tekst)}</span>
            <span class="acc-arrow">▶</span>
          </button>
          <div class="acc-body">
            ${notes ? `<p>${esc(notes)}</p>` : `<p class="acc-no-notes">Ingen notater for dette punktet.</p>`}
          </div>
        </div>`;
    });
    h += `</div>`;
  }

  const gorevler = r.gorevler || [];
  h += `<div class="det-sec"><div class="det-sec-title">📋 Oppgavefordeling</div>`;

  if (gorevler.length) {
    gorevler.forEach((g, i) => {
      const st = STATUSER[g.status] || STATUSER.ikke_startet;
      h += `
        <div class="task-card ${g.status === 'avbrutt' ? 'avbrutt' : ''}">
          <div class="task-card-row1">
            <span class="task-who">${esc(g.kisi)}</span>
            <span class="task-name">${esc(g.gorev)}</span>
          </div>
          <div class="task-card-row2">
            <span class="status-badge ${st.cls}">${st.ikon} ${st.label}</span>
            ${g.son_tarih ? `<span class="task-due">📅 ${fmtDate(g.son_tarih)}</span>` : ''}
          </div>
          ${g.notater ? `<div class="task-notes-text">💬 ${esc(g.notater)}</div>` : ''}

          <div class="task-edit-box">
            <div class="task-edit-row">
              <select id="task-status-${i}">
                <option value="ikke_startet" ${g.status === 'ikke_startet' ? 'selected' : ''}>⬜ Ikke startet</option>
                <option value="pagaar" ${g.status === 'pagaar' ? 'selected' : ''}>🔄 Pågår</option>
                <option value="fullfort" ${g.status === 'fullfort' ? 'selected' : ''}>✅ Fullført</option>
                <option value="avbrutt" ${g.status === 'avbrutt' ? 'selected' : ''}>❌ Avbrutt</option>
              </select>
              <button class="btn btn-sec btn-sm" onclick="updateTaskStatus('${r.id}', ${i})">Lagre status</button>
            </div>
          </div>
        </div>`;
    });
  } else {
    h += `<p style="color:var(--muted);font-style:italic;font-size:.875rem">Ingen oppgaver tildelt.</p>`;
  }
  h += `</div>`;

  if (r.sonraki_toplanti) {
    h += `<div class="next-banner">
      <span class="ni">📅</span>
      <div>
        <div class="next-label">Neste møte:</div>
        <div class="next-date">${fmtDate(r.sonraki_toplanti)}</div>
      </div>
    </div>`;
  }

  h += `<div style="text-align:right;margin-bottom:1.25rem">
    <button class="btn btn-danger btn-sm" onclick="deleteReferat('${r.id}')">🗑 Slett referat</button>
  </div>`;

  const yorumlar = r.yorumlar || [];
  h += `<div class="comments-wrap">
    <h2>💬 Kommentarer</h2>`;

  if (!yorumlar.length) {
    h += `<p style="color:var(--muted);font-style:italic;font-size:.875rem;margin-bottom:.75rem">Ingen kommentarer ennå.</p>`;
  } else {
    yorumlar.forEach(y => {
      h += `<div class="com-item">
        <div class="com-top"><span class="com-avatar">${esc((y.yazar||'?').charAt(0))}</span><span class="com-author">${esc(y.yazar)}</span><span class="com-date">${fmtDT(y.tarih)}</span></div>
        <p class="com-text">${esc(y.metin)}</p>
      </div>`;
    });
  }

  const alle = [...STD_DELTAKERE, ...EXT_DELTAKERE];
  h += `<div class="com-form">
    <label>Legg til kommentar</label>
    <div class="com-row">
      <select id="com-author">${alle.map(m => `<option value="${m}">${m}</option>`).join('')}</select>
      <textarea id="com-text" placeholder="Skriv din kommentar..."></textarea>
    </div>
    <div style="text-align:right;margin-top:.4rem">
      <button class="btn btn-primary btn-sm" onclick="addComment('${r.id}')">Send ➤</button>
    </div>
  </div></div>`;

  el.innerHTML = h;
}

function toggleAcc(rid, i) {
  const item = document.getElementById(`acc-${rid}-${i}`);
  item.classList.toggle('open');
}

async function updateTaskStatus(referatId, taskIndex) {
  if (!currentReferat || currentReferat.id !== referatId) return;

  const selectEl = document.getElementById(`task-status-${taskIndex}`);
  if (!selectEl) return;

  const newStatus = selectEl.value;
  const gorevler = Array.isArray(currentReferat.gorevler) ? [...currentReferat.gorevler] : [];
  if (!gorevler[taskIndex]) return;

  gorevler[taskIndex] = {
    ...gorevler[taskIndex],
    status: newStatus
  };

  loading(true);
  try {
    await db.collection('referatlar').doc(referatId).update({ gorevler });
    currentReferat.gorevler = gorevler;
    toast('✓ Status oppdatert!', 'ok');
    await loadDetail(referatId);
  } catch (e) {
    toast('Feil ved oppdatering', 'err');
  } finally {
    loading(false);
  }
}

async function addComment(id) {
  const author = document.getElementById('com-author').value;
  const text = document.getElementById('com-text').value.trim();
  if (!text) {
    document.getElementById('com-text').focus();
    return;
  }

  const c = { yazar: author, metin: text, tarih: new Date().toISOString() };
  loading(true);
  try {
    await db.collection('referatlar').doc(id).update({
      yorumlar: firebase.firestore.FieldValue.arrayUnion(c)
    });
    toast('✓ Kommentar lagt til!', 'ok');
    loadDetail(id);
  } catch(e) {
    toast('Feil', 'err');
  } finally {
    loading(false);
  }
}

async function deleteReferat(id) {
  if (!confirm('Er du sikker på at du vil slette dette referatet?')) return;
  loading(true);
  try {
    await db.collection('referatlar').doc(id).delete();
    toast('✓ Slettet.', 'ok');
    showList();
  } catch(e) {
    toast('Feil', 'err');
  } finally {
    loading(false);
  }
}

function fmtDate(s) {
  if (!s) return '';
  try {
    return new Date(s + 'T12:00:00').toLocaleDateString('nb-NO', {
      day:'numeric', month:'long', year:'numeric'
    });
  } catch {
    return s;
  }
}

function fmtDT(s) {
  if (!s) return '';
  try {
    return new Date(s).toLocaleDateString('nb-NO', {
      day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
    });
  } catch {
    return '';
  }
}

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function escAttr(s) {
  return String(s || '')
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

let _tTimer;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(_tTimer);
  _tTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function loading(on) {
  document.getElementById('loading-overlay').classList.toggle('on', on);
}

function init() {
  if (!IS_CONFIGURED) {
    alert('Firebase er ikke konfigurert ennå.');
    return;
  }
  if (sessionStorage.getItem('auth') === '1') showApp();
  else showScreen('login-screen');
}

init();
</script>
</body>
</html>
